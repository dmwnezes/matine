<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#120E2B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Matinê</title>
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    /* Paleta "Noite suave" (a mesma da Estante e do Palavreiro) */
    --bg: #120E2B; --card: #231C48; --card2: #2F275C; --line: #4A4180;
    --text: #F4F1FF; --muted: #A9A2D0; --accent: #9B8CFF; --on-accent: #1A1438; --red: #E5737A; --green: #5FB873; --yellow: #E6C14F;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { overflow: hidden; }
  html, body { margin: 0; height: 100%; background: linear-gradient(#2A2058, #120E2B) fixed, var(--bg); color: var(--text); font-family: Outfit, system-ui, -apple-system, sans-serif; overscroll-behavior: none; }
  body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
  button { font-family: inherit; }
  [hidden] { display: none !important; }

  /* Entrada */
  #inicio { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: safe center; padding: 28px; text-align: center; gap: 14px; overflow-y: auto; }
  .marquee { display: flex; gap: 6px; padding: 8px 12px; border-radius: 16px; background: var(--card); box-shadow: 0 8px 18px rgba(0,0,0,.4); }
  .marquee i { width: 8px; height: 8px; border-radius: 50%; background: var(--yellow); animation: blink 1.6s infinite; }
  .marquee i:nth-child(even) { animation-delay: .8s; }
  @keyframes blink { 0%, 100% { opacity: 1; box-shadow: 0 0 6px var(--yellow) } 50% { opacity: .35; box-shadow: none } }
  h1 { margin: 6px 0 0; font-size: 34px; font-weight: 800; letter-spacing: -.5px; }
  .sub { color: var(--muted); font-size: 15px; max-width: 320px; line-height: 1.4; margin: 0; }
  input[type=text], input[type=url] {
    width: 100%; max-width: 320px; padding: 14px 18px; border-radius: 18px; border: 1.5px solid var(--line);
    background: var(--card); color: var(--text); font: inherit; font-size: 17px; outline: none;
  }
  input:focus { border-color: var(--accent); }
  .btn { border: 0; border-radius: 999px; padding: 14px 28px; background: var(--accent); color: var(--on-accent); font-size: 16px; font-weight: 600; cursor: pointer; }
  .btn:disabled { opacity: .45; }
  .btn.ghost { background: transparent; color: var(--text); box-shadow: inset 0 0 0 1.5px var(--line); }
  .err { color: var(--red); font-size: 14px; max-width: 320px; margin: 0; min-height: 1em; }
  .pic svg { width: 100%; height: 100%; display: block; border-radius: 50%; }
  #minhaFoto { width: 84px; height: 84px; display: block; }
  .picks { display: grid; grid-template-columns: repeat(7, 40px); gap: 8px; justify-content: center; }
  .picks button { width: 40px; height: 40px; padding: 0; border: 0; border-radius: 50%; background: none; cursor: pointer; transition: box-shadow .15s, transform .15s; }
  .picks button svg { width: 100%; height: 100%; display: block; }
  .picks button.on { box-shadow: 0 0 0 3px var(--accent); transform: scale(1.06); }
  .picks button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .filme { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 320px; }
  @media (max-height: 760px) { .marquee { display: none; } #minhaFoto { width: 64px; height: 64px; } }

  /* Sala */
  #sala { display: none; flex: 1; flex-direction: column; min-height: 0; overflow: hidden; }
  #sala.on { display: flex; position: fixed; left: 0; right: 0; top: var(--vv-top, 0px); height: var(--vv-h, 100dvh); }
  .player { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; flex: none; padding-top: env(safe-area-inset-top); box-sizing: content-box; }
  video { width: 100%; height: 100%; display: block; background: #000; }
  .overlay { position: absolute; inset: 0; z-index: 4; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 16px; background: rgba(10,7,30,.82); color: #fff; font-size: 15px; line-height: 1.4; }
  .overlay p { margin: 0 0 12px; max-width: 360px; }
  .overlay .btn { padding: 11px 22px; font-size: 15px; }
  .overlay.show { display: flex; }
  .side { display: flex; flex-direction: column; flex: 1; min-height: 0; }

  .mini { display: flex; align-items: center; gap: 10px; margin: 8px 12px; padding: 6px 12px 6px 8px; border-radius: 999px; background: var(--card); flex: none; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .mini .bolas { display: flex; }
  .bolas > span { position: relative; width: 32px; height: 32px; border-radius: 50%; margin-right: -9px; border: 2px solid var(--card); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; color: #1A1438; overflow: hidden; }
  .bolas > span svg { width: 100%; height: 100%; }
  .mini .nomes { flex: 1; min-width: 0; margin-left: 8px; display: flex; flex-direction: column; }
  .mini .nomes b { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini .nomes > span { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sync { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .sync::before { content: "●"; margin-right: 5px; }
  .sync.ok::before { color: var(--green); }
  .sync.off::before { color: var(--red); }

  #chat { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 14px; display: flex; flex-direction: column; gap: 6px; -webkit-overflow-scrolling: touch; }
  .msg { display: flex; }
  .msg.mine { justify-content: flex-end; }
  .bubble { max-width: 78%; padding: 8px 12px; border-radius: 18px 18px 18px 4px; background: var(--card2); font-size: 15px; line-height: 1.35; overflow-wrap: anywhere; }
  .msg.mine .bubble { background: var(--accent); color: var(--on-accent); border-radius: 18px 18px 4px 18px; }
  .bubble small { display: block; font-size: 12px; font-weight: 600; }
  .sys { text-align: center; color: var(--muted); font-size: 12px; padding: 2px 0; }
  .empty { text-align: center; color: var(--muted); opacity: .7; font-size: 13px; padding-top: 20px; }

  .reacts { display: flex; justify-content: space-between; padding: 4px 12px 0; flex: none; }
  .reacts button { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--card); font-size: 22px; line-height: 1; padding: 0; cursor: pointer; transition: transform .12s; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  .reacts button:active { transform: scale(1.25); }
  #digitando { display: none; align-items: center; gap: 8px; padding: 2px 18px; color: var(--muted); font-size: 12px; flex: none; }
  #digitando.on { display: flex; }
  .pulos { display: flex; gap: 3px; }
  .pulos i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: hop .9s infinite; }
  .pulos i:nth-child(2) { animation-delay: .15s; } .pulos i:nth-child(3) { animation-delay: .3s; }
  @keyframes hop { 0%, 60%, 100% { transform: none; opacity: .5 } 30% { transform: translateY(-4px); opacity: 1 } }

  #flutuantes { position: absolute; inset: 0; z-index: 3; pointer-events: none; overflow: hidden; }
  .float { position: absolute; bottom: 30px; display: flex; flex-direction: column; align-items: center; animation: rise 2.6s cubic-bezier(.2,.6,.3,1) forwards; }
  .float b { font-size: 34px; line-height: 1; }
  .float span { margin-top: 2px; padding: 0 5px; border-radius: 6px; background: rgba(0,0,0,.45); color: #fff; font-size: 10px; }
  @keyframes rise {
    0% { transform: translate(0, 0) scale(.6); opacity: 0 }
    12% { opacity: 1; transform: translate(6px, -12%) scale(1.15) }
    50% { transform: translate(-10px, -55%) scale(1) }
    100% { transform: translate(8px, -110%) scale(1); opacity: 0 }
  }

  form { display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); flex: none; }
  form input { flex: 1; max-width: none !important; border-radius: 28px !important; border-color: transparent !important; }
  form button { width: 48px; height: 48px; flex: none; border-radius: 50%; border: 0; background: var(--line); color: var(--muted); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  form button.on { background: var(--accent); color: var(--on-accent); }
  form svg { width: 22px; height: 22px; }

  /* Teclado aberto: player menor no topo, faixa de pessoas e reações somem. */
  body.kb .player { aspect-ratio: auto; height: min(56.25vw, calc(var(--vv-h, 100dvh) * 0.34)); padding-top: 0; }
  body.kb .mini, body.kb .reacts { display: none; }
  /* Celular deitado (sem teclado): player à esquerda, chat à direita. */
  body.land:not(.kb) #sala { flex-direction: row; }
  body.land:not(.kb) .player { width: 62%; height: var(--vv-h, 100dvh); aspect-ratio: auto; padding-top: 0; }

  /* Folha: quem está na sala, convidar, trocar filme */
  #folha { position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center; padding: 18px; background: rgba(10,7,30,.72); }
  #folha.show { display: flex; }
  #folha .box { width: 100%; max-width: 380px; max-height: 88vh; overflow-y: auto; padding: 20px; border-radius: 28px; background: var(--card); text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; }
  #folha h2 { margin: 0; font-size: 18px; font-weight: 600; }
  .quem { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
  .quem .p { width: 76px; font-size: 12px; }
  .quem .p > span { display: flex; width: 58px; height: 58px; margin: 0 auto 6px; border-radius: 50%; align-items: center; justify-content: center; font-weight: 800; font-size: 22px; color: #1A1438; overflow: hidden; }
  .quem .p > span svg { width: 100%; height: 100%; }
  .quem .p.eu > span { box-shadow: 0 0 0 2px var(--accent); }
  .quem .p div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .codigo { font-size: 28px; font-weight: 800; letter-spacing: 6px; color: var(--accent); }
  .hint { color: var(--muted); font-size: 12px; margin: 0; }
  .acoes { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .acoes .btn { padding: 11px 20px; font-size: 15px; }
  #toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 40; padding: 10px 16px; border-radius: 999px; background: var(--card2); color: var(--text); font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; }
  #toast.on { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .marquee i, .pulos i, .float { animation: none; } }
</style>
</head>
<body>

<section id="inicio">
  <div class="marquee" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <h1>Matinê</h1>
  <p class="sub" id="textoInicio">Carregando…</p>
  <span class="pic" id="minhaFoto" aria-hidden="true"></span>
  <input type="text" id="nome" placeholder="Seu nome" maxlength="24" autocomplete="nickname" aria-label="Seu nome">
  <p class="sub">Escolha sua foto</p>
  <div class="picks" id="fotos" role="group" aria-label="Fotos de perfil"></div>
  <div class="filme" id="campoFilme" hidden>
    <input type="url" id="link" placeholder="Link do vídeo (.mp4, Drive, Dropbox…)" aria-label="Link do vídeo" inputmode="url" autocomplete="off">
    <input type="text" id="titulo" placeholder="Nome do filme (opcional)" maxlength="80" aria-label="Nome do filme">
  </div>
  <button class="btn" id="entrar" disabled>Entrar</button>
  <p class="err" id="erroInicio" role="alert"></p>
</section>

<section id="sala">
  <div class="player">
    <video id="video" playsinline controls preload="auto"></video>
    <div class="overlay" id="aviso"></div>
    <div id="flutuantes"></div>
  </div>
  <div class="side">
    <button class="mini" id="mini" type="button" aria-label="Quem está na sala e convidar">
      <div class="bolas" id="bolas"></div>
      <div class="nomes"><b id="nomes"></b><span><span id="codigoMini"></span> · <span id="tituloMini"></span></span></div>
      <div class="sync" id="sync">conectando…</div>
    </button>
    <div id="chat" aria-live="polite"><div class="empty">O chat da sala aparece aqui.</div></div>
    <div id="digitando"><div class="pulos"><i></i><i></i><i></i></div><span id="textoDigitando"></span></div>
    <div class="reacts" id="reacoes"></div>
    <form id="form" autocomplete="off">
      <input type="text" id="texto" placeholder="Mensagem para a sala" maxlength="500" enterkeyhint="send" aria-label="Mensagem">
      <button id="enviar" aria-label="Enviar"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12 2-12 2z"/></svg></button>
    </form>
  </div>
</section>

<div id="folha" role="dialog" aria-modal="true" aria-labelledby="folhaTitulo">
  <div class="box">
    <h2 id="folhaTitulo">Na sala</h2>
    <div class="quem" id="quem"></div>
    <div class="codigo" id="codigoFolha"></div>
    <p class="hint">Quem tiver o link (ou o código) entra na sala.</p>
    <div class="acoes">
      <button class="btn" id="convidar" type="button">Convidar</button>
      <button class="btn ghost" id="trocar" type="button" hidden>Trocar filme</button>
    </div>
    <div class="filme" id="trocaFilme" hidden>
      <input type="url" id="novoLink" placeholder="Link do novo vídeo" aria-label="Link do novo vídeo" inputmode="url" autocomplete="off">
      <input type="text" id="novoTitulo" placeholder="Nome do filme (opcional)" maxlength="80" aria-label="Nome do novo filme">
      <button class="btn" id="salvarFilme" type="button">Passar este</button>
      <p class="err" id="erroTroca" role="alert"></p>
    </div>
    <button class="btn ghost" id="fechar" type="button">Fechar</button>
  </div>
</div>
<div id="toast" role="status"></div>

<script type="importmap">
{ "imports": { "mediabunny": "https://cdn.jsdelivr.net/npm/mediabunny@1.62.0/dist/bundles/mediabunny.min.mjs" } }
</script>
<script src="avatars.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
