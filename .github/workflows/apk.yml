name: Gerar APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Conferir a chave de assinatura
        env:
          APK_KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_B64 }}
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$APK_KEYSTORE_B64" ] || [ -z "$APK_KEYSTORE_PASSWORD" ]; then
            echo "::error::Faltam os Secrets APK_KEYSTORE_B64 e APK_KEYSTORE_PASSWORD (veja o README, 'Assinatura do APK')."
            exit 1
          fi

      - name: Testar e compilar
        run: ./gradlew testDebugUnitTest assembleRelease --no-daemon

      # lineage.bin prova que a chave nova veio da antiga: o Android instala por cima sem apagar os dados do app.
      - name: Assinar APK
        env:
          APK_KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_B64 }}
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
        run: |
          FERRAMENTAS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          echo "$APK_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/chave.p12"
          "$FERRAMENTAS/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/alinhado.apk"
          "$FERRAMENTAS/apksigner" sign --ks "$RUNNER_TEMP/chave.p12" --ks-pass env:APK_KEYSTORE_PASSWORD \
            --lineage app/signing/lineage.bin --min-sdk-version 28 --rotation-min-sdk-version 28 \
            --v1-signing-enabled false --v2-signing-enabled false --v3-signing-enabled true \
            --out Matine.apk "$RUNNER_TEMP/alinhado.apk"
          "$FERRAMENTAS/apksigner" verify --min-sdk-version 28 --print-certs Matine.apk
          rm -f "$RUNNER_TEMP/chave.p12"

      - name: Publicar versão
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Matinê 1.0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: Matine.apk
          make_latest: true
