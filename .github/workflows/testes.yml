name: Testes do site

on:
  push:
    paths: ["*.js", "*.html", "database.rules.json", "test/**", ".github/workflows/testes.yml"]
  workflow_dispatch:

jobs:
  sincronia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  dois-aparelhos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm i --no-save --no-audit --no-fund playwright firebase@10.14.1 mediabunny@1.62.0 firebase-tools@15
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
